[build-system]
requires = ["setuptools>=59.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sushi_gui"
version = "1.3.0"
authors = [
  { name = "Maxime Gendebien", email = "max@elk.audio" },
  { name = "Gustav Andersson", email = "gustav@elk.audio" },
]
description = "A simple GUI for Sushi, using PySide and gRPC."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
dependencies = ['elkpy==1.3.0','grpcio', 'grpcio-tools', 'PySide6>=6.4']
